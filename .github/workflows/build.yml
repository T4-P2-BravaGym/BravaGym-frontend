name: build

on:
  push:
    branches: [main, develop]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci            # needs package-lock.json committed
      - run: npm run build
      - name: Dependency audit
        run: npm audit --audit-level=high
        continue-on-error: true  # reports vulnerabilities without blocking the bootcamp delivery
